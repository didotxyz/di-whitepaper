<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">业务利润 → 回购与销毁</title><desc id="desc">产品服务付费. 量化净利润约定分成. DI 自身业务利润. 计划以部分利润回购并销毁 $DI. 不包含用户本金及应支付给用户的收益. 服务支付本身不等于代币销毁</desc><defs><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#372a18"/><stop offset="1" stop-color="#0a0906"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#d9b779"/></marker></defs><rect width="1200" height="850" fill="#070705"/><g fill="none" stroke="#957243" stroke-width="2" opacity=".7"><path d="M0 60 Q140 180 210 0 M990 0 Q1060 180 1200 60 M0 790 Q140 670 210 850 M990 850 Q1060 670 1200 790"/></g><g fill="#f1e4c7" font-family="Georgia, Noto Serif SC, SimSun, serif"><text x="600" y="75" text-anchor="middle" font-size="43">业务利润 → 回购与销毁</text><rect x="70" y="130" width="470" height="110" rx="4" fill="url(#glass)" stroke="#ba945a"/><text x="305.0" y="197.0" text-anchor="middle" font-size="34">产品服务付费</text><rect x="660" y="130" width="470" height="110" rx="4" fill="url(#glass)" stroke="#ba945a"/><text x="895.0" y="197.0" text-anchor="middle" font-size="34">量化净利润约定分成</text><rect x="260" y="340" width="680" height="110" rx="4" fill="url(#glass)" stroke="#ba945a"/><text x="600.0" y="407.0" text-anchor="middle" font-size="34">DI 自身业务利润</text><rect x="210" y="550" width="780" height="110" rx="4" fill="url(#glass)" stroke="#ba945a"/><text x="600.0" y="617.0" text-anchor="middle" font-size="34">计划以部分利润回购并销毁 $DI</text><g fill="none" stroke="#d9b779" stroke-width="2.5" marker-end="url(#arrow)"><path d="M305 240 Q305 300 500 330"/><path d="M895 240 Q895 300 700 330"/><path d="M600 450V535"/></g><text x="600" y="724" text-anchor="middle" font-size="27">不包含用户本金及应支付给用户的收益</text><text x="600" y="775" text-anchor="middle" fill="#b5a98d" font-size="25">服务支付本身不等于代币销毁</text></g></svg>
